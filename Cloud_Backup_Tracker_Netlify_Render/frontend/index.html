<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cloud Backup Tracker</title><link rel="stylesheet" href="style.css"></head><body>
<header><h1>☁ Cloud Backup Tracker</h1><button id="logout" hidden>Logout</button></header><main>
<section id="auth"><h2 id="authTitle">Login</h2><div id="signupFields" hidden><label>Name</label><input id="name"></div><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><button id="authBtn">Login</button><p><button class="link" id="switch">Need an account? Sign up</button></p></section>
<section id="dashboard" hidden><nav><button data-tab="summary">Dashboard</button><button data-tab="upload">Upload Backup</button><button data-tab="files">My Files / Restore</button></nav><h2 id="hello"></h2><p id="summary"></p><section id="uploadArea" hidden><h3>Upload files</h3><input id="uploads" type="file" multiple><button id="uploadBtn">Upload Backup</button></section><section id="filesArea"><input id="search" placeholder="Search files"><div id="fileList"></div></section></section><p id="message"></p></main><script src="app.js"></script></body></html>
